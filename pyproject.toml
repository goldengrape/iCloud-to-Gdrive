[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-to-gdrive"
version = "0.1.0"
description = "Local client for migrating iCloud data to Google Drive"
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rmd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
